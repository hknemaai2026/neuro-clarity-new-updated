    height: 297mm;

    visibility: hidden;
  }

  #print-report,
  #print-report * {
    visibility: visible;

  #print-report {

    position: absolute;

    top: 0;

    left: 50%;

    padding: 8mm !important;

    background: white;

    zoom: 89%;

    overflow: hidden !important;
